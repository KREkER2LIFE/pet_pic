<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Link font -->    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>RandomPetImg</title>
      <style>
  :root {
    --cream: #F7F2E7;
    --ink: #23271F;
    --dog: #D9631E;
    --cat: #2F5D74;
    --line: rgba(35,39,31,0.14);
    --card: #FFFFFF;
    --accent: var(--dog);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #1B1B16;
      --ink: #EFE9DA;
      --card: #262620;
      --line: rgba(239,233,218,0.16);
    }
  }
  :root[data-theme="dark"] {
    --cream: #1B1B16;
    --ink: #EFE9DA;
    --card: #262620;
    --line: rgba(239,233,218,0.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  justify-content: center;
}
main { width: 100%; max-width: 560px; padding: 2.5rem 1.5rem 3rem; }
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: clamp(2.2rem, 8vw, 3rem);
  line-height: 1;
  margin: 0 0 0.35rem;
  letter-spacing: -0.01em;
}
.tagline { margin: 0 0 1.75rem; color: var(--ink); opacity: 0.62; font-size: 0.98rem; }
.tabs {
  display: flex; gap: 0; border: 1px solid var(--line);
  border-radius: 999px; padding: 4px; width: fit-content; margin-bottom: 1.5rem;
}
.tab {
  border: none; background: transparent; font-family: 'Inter', sans-serif;
  font-size: 0.95rem; font-weight: 500; padding: 0.5rem 1.15rem;
  border-radius: 999px; cursor: pointer; color: var(--ink); opacity: 0.55;
  transition: background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
}
.tab[aria-selected="true"] { opacity: 1; background: var(--accent); color: #FFF9F0; }
.controls { display: flex; gap: 0.6rem; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
select, button.fetch {
  font-family: 'Inter', sans-serif; font-size: 0.95rem; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 0.65rem 0.9rem;
}
select { flex: 1; min-width: 140px; }
button.fetch {
  background: var(--accent); color: #FFF9F0; border: none; font-weight: 600;
  cursor: pointer; padding: 0.65rem 1.3rem; transition: opacity 0.15s ease, transform 0.1s ease;
}
button.fetch:hover { opacity: 0.92; }
button.fetch:active { transform: scale(0.98); }
button.fetch:disabled { opacity: 0.5; cursor: default; }
.frame {
  position: relative; border-radius: 18px; overflow: hidden; background: var(--card);
  border: 1px solid var(--line); aspect-ratio: 1 / 1; display: flex;
  align-items: center; justify-content: center;
}
.frame img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.35s ease; }
.frame img.loaded { opacity: 1; }
.status { position: absolute; font-size: 0.88rem; opacity: 0.55; }
.status.error { color: var(--dog); opacity: 0.9; }
.meta { margin-top: 0.9rem; font-size: 0.85rem; opacity: 0.55; min-height: 1.2em; text-transform: capitalize; }
footer { margin-top: 2.5rem; font-size: 0.78rem; opacity: 0.4; border-top: 1px solid var(--line); padding-top: 1rem; }
</style>
<script>
  const state = { species: 'dog', breeds: [] };
  const tabDog = document.getElementById('tab-dog');
  const tabCat = document.getElementById('tab-cat');
  const breedSelect = document.getElementById('breedSelect');
  const fetchBtn = document.getElementById('fetchBtn');
  const photo = document.getElementById('photo');
  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const root = document.documentElement;

  function setSpecies(species) {
    state.species = species;
    if (species === 'dog') {
      root.style.setProperty('--accent', 'var(--dog)');
    } else {
      root.style.setProperty('--accent', 'var(--cat)');
    }
    tabDog.setAttribute('aria-selected', species === 'dog');
    tabCat.setAttribute('aria-selected', species === 'cat');
  }

  tabDog.addEventListener('click', () => setSpecies('dog'));
  tabCat.addEventListener('click', () => setSpecies('cat'));
</script>
</head>
<body>
    <div class="tabs" role="tablist" aria-label="Animal">
  <button class="tab" id="tab-dog" role="tab" aria-selected="true">Dogs</button>
  <button class="tab" id="tab-cat" role="tab" aria-selected="false">Cats</button>
</div>
<div class="controls">
  <select id="breedSelect" aria-label="Breed"></select>
  <button class="fetch" id="fetchBtn">New photo</button>
</div>
<div class="frame">
  <img id="photo" alt="">
  <span class="status" id="status">Loading…</span>
</div>
<div class="meta" id="meta"></div>
<footer>Images via dog.ceo and TheCatAPI.</footer>
</body>
</html>
