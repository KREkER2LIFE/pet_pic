<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Link font -->    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>RandomPetImg</title>
      <style>
  :root {
    --cream: #F7F2E7;
    --ink: #23271F;
    --dog: #D9631E;
    --cat: #2F5D74;
    --line: rgba(35,39,31,0.14);
    --card: #FFFFFF;
    --accent: var(--dog);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --cream: #1B1B16;
      --ink: #EFE9DA;
      --card: #262620;
      --line: rgba(239,233,218,0.16);
    }
  }
  :root[data-theme="dark"] {
    --cream: #1B1B16;
    --ink: #EFE9DA;
    --card: #262620;
    --line: rgba(239,233,218,0.16);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  display: flex;
  justify-content: center;
}
main { width: 100%; max-width: 560px; padding: 2.5rem 1.5rem 3rem; }
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: clamp(2.2rem, 8vw, 3rem);
  line-height: 1;
  margin: 0 0 0.35rem;
  letter-spacing: -0.01em;
}
.tagline { margin: 0 0 1.75rem; color: var(--ink); opacity: 0.62; font-size: 0.98rem; }
</style>
</head>

</body>
</html>
